###############################################################################

name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'

# Cancel in-progress runs for the same ref (e.g. rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-15
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: apple-clang
          - os: macos-latest
            compiler: gcc-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15 (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc-15'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          echo "CXX=g++-15" >> "$GITHUB_ENV"

      - name: Install latest Clang (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh
          # llvm.sh installs the latest stable release; pick the highest
          # versioned clang++ it produced.
          ver=$(ls /usr/bin/clang++-* | sed 's/.*clang++-//' | sort -n | tail -1)
          echo "CXX=clang++-${ver}" >> "$GITHUB_ENV"

      - name: Select Apple Clang (macOS)
        if: matrix.os == 'macos-latest' && matrix.compiler == 'apple-clang'
        run: echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install GCC 15 (macOS)
        if: matrix.os == 'macos-latest' && matrix.compiler == 'gcc-15'
        run: |
          brew install gcc@15
          echo "CXX=g++-15" >> "$GITHUB_ENV"

      - name: Build and run tests
        working-directory: test
        run: make CXX="$CXX"

  windows-msvc:
    name: windows-latest / msvc
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # The library is header-only, so MSVC just needs the repository root on
      # its include path (for the "timer/..." includes). Each test is a single
      # translation unit; commands are chained with && so any failure fails
      # the step.
      - name: Build and run tests
        shell: cmd
        run: >
          cl /nologo /EHsc /std:c++latest /W3 /I.
          test\test_timer.cpp /Fe:test_timer.exe &&
          test_timer.exe &&
          cl /nologo /EHsc /std:c++latest /W3 /I.
          test\test_execution_stopper.cpp /Fe:test_execution_stopper.exe &&
          test_execution_stopper.exe

  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Build and run with sanitizers
        working-directory: test
        run: >
          make OPT=debug CXX=g++-15
          EXTRA_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
